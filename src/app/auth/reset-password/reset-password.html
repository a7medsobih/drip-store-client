<section
  class="min-h-screen bg-background px-md py-xl text-on-surface md:px-lg"
>
  <div class="mx-auto flex min-h-[calc(100vh-80px)] max-w-3xl items-center justify-center">
    <div class="glass-card w-full rounded-[32px] p-lg md:p-xl">
      <div class="auth-card-header">
        <p class="font-label-caps text-label-caps text-primary">Password recovery</p>
        <h1 class="font-display text-display-lg-mobile text-primary md:text-display-md">
          Reset password
        </h1>
        <p class="text-body-md text-on-surface-variant/80">
          Verify the OTP sent to your email, then set a new password.
        </p>
      </div>

      <form class="grid gap-md md:grid-cols-2" (ngSubmit)="submit()">
        <label class="block space-y-sm md:col-span-2">
          <span class="font-label-caps text-label-caps text-on-surface-variant">Email</span>
          <input
            class="w-full rounded-2xl border border-outline-variant/50 bg-surface-container-low px-md py-md outline-none transition focus:border-primary"
            type="email"
            name="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            placeholder="admin@gmail.com"
          />
        </label>

        <label class="block space-y-sm md:col-span-2">
          <span class="font-label-caps text-label-caps text-on-surface-variant">OTP</span>
          <input
            class="w-full rounded-2xl border border-outline-variant/50 bg-surface-container-low px-md py-md outline-none transition focus:border-primary"
            type="text"
            name="otp"
            [ngModel]="otp()"
            (ngModelChange)="otp.set($event)"
            placeholder="Enter the verification code"
          />
        </label>

        <label class="block space-y-sm">
          <span class="font-label-caps text-label-caps text-on-surface-variant">New password</span>
          <input
            class="w-full rounded-2xl border border-outline-variant/50 bg-surface-container-low px-md py-md outline-none transition focus:border-primary"
            type="password"
            name="newPassword"
            [ngModel]="newPassword()"
            (ngModelChange)="newPassword.set($event)"
            placeholder="New password"
          />
        </label>

        <label class="block space-y-sm">
          <span class="font-label-caps text-label-caps text-on-surface-variant">Confirm password</span>
          <input
            class="w-full rounded-2xl border border-outline-variant/50 bg-surface-container-low px-md py-md outline-none transition focus:border-primary"
            type="password"
            name="confirmPassword"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
            placeholder="Repeat the password"
          />
        </label>

        @if (errorMessage()) {
          <p class="rounded-2xl bg-error-container px-md py-sm text-body-sm text-on-error-container md:col-span-2">
            {{ errorMessage() }}
          </p>
        }

        @if (successMessage()) {
          <p class="rounded-2xl bg-secondary-container px-md py-sm text-body-sm text-on-secondary-container md:col-span-2">
            {{ successMessage() }}
          </p>
        }

        <div class="flex items-center justify-between gap-md md:col-span-2">
          <a
            routerLink="/forgot-password"
            class="font-label-caps text-label-caps text-primary transition hover:opacity-80"
          >
            Back
          </a>
          <app-button type="submit" [variant]="'primary'">
            {{ isSubmitting() ? 'Saving...' : 'Reset password' }}
          </app-button>
        </div>
      </form>
    </div>
  </div>
</section>
