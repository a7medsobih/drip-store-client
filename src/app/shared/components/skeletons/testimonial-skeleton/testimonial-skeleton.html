<article class="hero-glass rounded-xl p-lg">
  <div class="mb-md flex items-center gap-sm text-primary">
    @for (star of starPlaceholders; track star) {
    <div class="h-6 w-6 rounded-full bg-primary-fixed-dim/50 animate-pulse"></div>
    }
  </div>

  <div class="mb-lg space-y-sm">
    <div class="h-4 w-full rounded-full bg-surface-container-high/70 animate-pulse"></div>
    <div class="h-4 w-11/12 rounded-full bg-surface-container-high/70 animate-pulse"></div>
    <div class="h-4 w-8/12 rounded-full bg-surface-container-high/70 animate-pulse"></div>
  </div>

  <div class="flex items-center gap-md">
    <div class="h-10 w-10 rounded-full bg-primary-fixed-dim/60 animate-pulse"></div>

    <div>
      <div class="h-3 w-20 rounded-full bg-primary-fixed-dim/60 animate-pulse"></div>

      <div class="mt-xs h-2.5 w-24 rounded-full bg-surface-container-high/70 animate-pulse"></div>
    </div>
  </div>
</article>
