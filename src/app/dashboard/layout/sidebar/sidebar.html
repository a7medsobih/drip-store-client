<aside
  class="sidebar"
  [class.sidebar--collapsed]="isCollapsed()"
  [class.sidebar--mobile-open]="isMobileOpen()"
>
  <div class="sidebar__brand">
    <div class="sidebar__brand-copy">
      <span class="sidebar__brand-mark">D</span>
      <span class="sidebar__brand-text" [class.sidebar__brand-text--hidden]="isCollapsed()">
        Drip Store
      </span>
    </div>

    <button
      type="button"
      class="sidebar__mobile-close"
      (click)="mobileClosed.emit()"
      aria-label="Close sidebar"
    >
      <span class="material-symbols-outlined">close</span>
    </button>

    <button
      type="button"
      class="sidebar__collapse"
      (click)="collapseToggled.emit()"
      [attr.aria-label]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <span class="material-symbols-outlined">
        {{ isCollapsed() ? 'chevron_right' : 'chevron_left' }}
      </span>
    </button>
  </div>

  <nav class="sidebar__nav">
    <ul class="sidebar__nav-list">
      @for (item of navItems; track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="sidebar__link--active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            (click)="mobileClosed.emit()"
            class="sidebar__link"
          >
            <span class="material-symbols-outlined sidebar__icon">
              {{ iconName(item.icon) }}
            </span>
            <span
              class="sidebar__label"
              [class.sidebar__label--hidden]="isCollapsed()"
            >
              {{ item.label }}
            </span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="sidebar__footer">
    <button type="button" class="sidebar__logout" (click)="logout()">
      <span class="material-symbols-outlined sidebar__icon">logout</span>
      <span
        class="sidebar__label"
        [class.sidebar__label--hidden]="isCollapsed()"
      >
        Logout
      </span>
    </button>
  </div>
</aside>
