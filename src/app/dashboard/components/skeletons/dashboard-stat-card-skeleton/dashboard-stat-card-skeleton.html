<div class="grid grid-cols-1 gap-lg sm:grid-cols-2 xl:grid-cols-4">
  @for (item of [1, 2, 3, 4]; track item) {
    <div class="rounded-3xl border border-white/10 bg-[#141414]/90 p-lg">
      <div class="mb-md flex items-start justify-between gap-md">
        <div class="skeleton-shimmer h-6 w-6 rounded-full"></div>
        <div class="skeleton-shimmer h-6 w-16 rounded-full"></div>
      </div>

      <div class="space-y-sm">
        <div class="skeleton-shimmer h-3 w-24 rounded-full"></div>
        <div class="skeleton-shimmer h-10 w-32 rounded-full"></div>
      </div>
    </div>
  }
</div>
