<div
  class="flex flex-col items-center justify-center gap-md rounded-3xl border border-outline-variant/40 bg-surface-container-low px-lg py-xl text-center"
>
  <div
    class="flex h-14 w-14 items-center justify-center rounded-full bg-surface-container text-primary"
  >
    <span class="material-symbols-outlined">
      {{ config()?.icon || 'inbox' }}
    </span>
  </div>

  <div class="max-w-copy">
    <p class="text-body-md text-on-surface-variant/80">
      {{ resolvedMessage() }}
    </p>
  </div>

  @if (resolvedActionLabel()) {
    <button
      type="button"
      class="home-btn home-btn--primary"
      (click)="actionClick.emit()"
    >
      {{ resolvedActionLabel() }}
    </button>
  }
</div>
